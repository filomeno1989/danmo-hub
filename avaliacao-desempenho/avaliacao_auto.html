<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto-Avaliacao de Desempenho — Danmo Service System</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; background: #F4F6F9; color: #2C3E50; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }

    .logo-bar { text-align: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 2px solid #1E293B; }
    .logo-bar h1 { font-size: 1.1rem; color: #1E293B; margin-bottom: 2px; }
    .logo-bar p { font-size: 0.82rem; color: #7F8C8D; }

    .form-card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 28px; width: 100%; max-width: 650px; margin-bottom: 20px; }
    .form-card h2 { font-size: 1.1rem; margin-bottom: 4px; color: #1E293B; }
    .form-card .sub { font-size: 0.85rem; color: #7F8C8D; margin-bottom: 20px; }

    .criterio { padding: 16px 0; border-bottom: 1px solid #E2E8F0; }
    .criterio:last-child { border-bottom: none; }
    .criterio-header { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
    .criterio-nome { font-weight: 700; font-size: 0.92rem; }
    .criterio-desc-toggle { background: none; border: none; color: #3B82F6; cursor: pointer; font-size: 0.78rem; font-weight: 600; padding: 2px 6px; border-radius: 4px; }
    .criterio-desc-toggle:hover { background: #DBEAFE; }
    .criterio-desc { display: none; font-size: 0.82rem; color: #7F8C8D; line-height: 1.5; margin-bottom: 10px; padding: 8px 12px; background: #F4F6F9; border-radius: 6px; }
    .criterio-desc.visivel { display: block; }

    .notas-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .nota-btn { padding: 8px 14px; border: 2px solid #E2E8F0; border-radius: 8px; background: #fff; cursor: pointer; font-size: 0.8rem; font-weight: 600; color: #2C3E50; transition: all 0.2s; text-align: center; min-width: 80px; }
    .nota-btn:hover { border-color: #F59E0B; background: #FEF3C7; }
    .nota-btn.selecionada { border-color: #F59E0B; background: #F59E0B; color: #fff; }

    .observacoes { margin-top: 20px; }
    .observacoes label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
    .observacoes textarea { width: 100%; padding: 12px; border: 1px solid #E2E8F0; border-radius: 8px; font-family: inherit; font-size: 0.88rem; resize: vertical; min-height: 80px; }
    .observacoes textarea:focus { outline: none; border-color: #F59E0B; }

    .btn-submit { display: block; width: 100%; padding: 14px; border: none; border-radius: 8px; background: #1E293B; color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 24px; transition: background 0.2s; }
    .btn-submit:hover { background: #0F172A; }
    .btn-submit:disabled { background: #94A3B8; cursor: not-allowed; }

    .msg-erro { background: #FEE2E2; color: #EF4444; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 0.88rem; }
    .msg-sucesso { background: #D1FAE5; color: #10B981; padding: 16px; border-radius: 8px; text-align: center; }
    .msg-sucesso h3 { margin-bottom: 6px; }

    .info-colab { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; background: #F4F6F9; border-radius: 8px; margin-bottom: 16px; }
    .info-colab div { font-size: 0.85rem; } .info-colab strong { color: #7F8C8D; font-size: 0.78rem; display: block; }

    .resumo-final { background: #FEF3C7; border: 2px solid #F59E0B; border-radius: 8px; padding: 14px; margin-top: 20px; text-align: center; }
    .resumo-final .media { font-size: 2rem; font-weight: 700; color: #D97706; }

    @media (max-width: 500px) {
      .notas-row { flex-direction: column; }
      .nota-btn { min-width: unset; width: 100%; }
      .info-colab { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="logo-bar">
    <h1>DANMO SERVICE SYSTEM, LDA</h1>
    <p>Auto-Avaliacao de Desempenho</p>
  </div>

  <div id="app">
    <div class="form-card" id="card-loading" style="text-align:center;padding:40px;">A carregar...</div>
    <div class="form-card" id="card-erro" style="display:none;"><div class="msg-erro" id="msg-erro"></div></div>
    <div class="form-card" id="card-ja-preenchido" style="display:none;"><div class="msg-sucesso"><h3>Avaliacao ja submetida</h3><p>A sua auto-avaliacao ja foi registada com sucesso em <strong id="data-submissao"></strong>. Obrigado.</p></div></div>
    <div class="form-card" id="card-formulario" style="display:none;">
      <h2 id="colab-nome"></h2>
      <p class="sub" id="colab-periodo"></p>

      <div class="info-colab" id="colab-info"></div>

      <div id="criterios-container"></div>

      <div class="observacoes">
        <label for="obs-text">Observacoes / Comentarios (opcional)</label>
        <textarea id="obs-text" placeholder="Escreva aqui qualquer comentario que considere relevante..." rows="3"></textarea>
      </div>

      <div class="resumo-final" id="resumo-final" style="display:none;">
        <div style="font-size:0.82rem;color:#7F8C8D;">Media da sua Auto-Avaliacao</div>
        <div class="media" id="resumo-media">—</div>
        <div style="font-size:0.85rem;" id="resumo-classificacao"></div>
      </div>

      <button class="btn-submit" id="btn-submeter" onclick="submeterAvaliacao()">Submeter Auto-Avaliacao</button>
    </div>
  </div>

  <script src="../shared/supabase.js"></script>

  <script>
  /* Criterios (iguais aos do painel) */
  var CRITERIOS = [
    { id: 'assiduidade', nome: 'Assiduidade', descricao: 'Frequencia e regularidade na comparencia ao trabalho. Cumprimento do horario sem faltas injustificadas.' },
    { id: 'pontualidade', nome: 'Pontualidade', descricao: 'Cumprimento dos horarios estabelecidos. Chegada ao posto de trabalho na hora certa.' },
    { id: 'produtividade', nome: 'Produtividade', descricao: 'Quantidade e qualidade do trabalho realizado. Capacidade de cumprir metas e prazos.' },
    { id: 'iniciativa', nome: 'Iniciativa', descricao: 'Capacidade de agir proativamente, propor melhorias sem necessidade de supervisao constante.' },
    { id: 'relacionamento', nome: 'Relacionamento Interpessoal', descricao: 'Qualidade da interacao com colegas e supervisores. Ambiente de trabalho positivo.' },
    { id: 'conhecimento', nome: 'Conhecimento Tecnico', descricao: 'Dominio das competencias tecnicas para a funcao. Aplicacao dos conhecimentos no dia a dia.' },
    { id: 'responsabilidade', nome: 'Responsabilidade', descricao: 'Assuncao das tarefas e compromisso com os resultados. Zelo pelos equipamentos da empresa.' },
    { id: 'disciplina', nome: 'Disciplina', descricao: 'Cumprimento das normas e regulamentos internos. Respeito pela hierarquia.' },
    { id: 'trabalho_equipa', nome: 'Trabalho em Equipa', descricao: 'Colaboracao com colegas. Disposicao para ajudar e partilhar conhecimento.' },
    { id: 'apresentacao_pessoal', nome: 'Apresentacao Pessoal', descricao: 'Cuidado com a aparencia, higiene e uso adequado dos EPIs quando necessario.' }
  ];

  var NOTAS_LABEL = { 1: 'Muito Insatisfaz', 2: 'Insatisfaz', 3: 'Satisfaz', 4: 'Bom', 5: 'Muito Bom' };
  var MESES_NOME = ['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  var avaliacao = null;
  var respostas = {};

  /* === INIT === */
  (async function init() {
    var params = new URLSearchParams(window.location.search);
    var token = params.get('t');
    if (!token) { mostrarErro('Link invalido. Contacte o administrador.'); return; }

    try {
      var lista = await db.query('rh_avaliacoes', 'token_auto=eq.' + encodeURIComponent(token) + '&limit=1');
      if (!lista.length) { mostrarErro('Avaliacao nao encontrada. O link pode estar incorrecto ou expirado.'); return; }
      avaliacao = lista[0];

      /* Verificar se campanha esta aberta */
      var campanhas = await db.query('rh_campanhas_avaliacao', 'id=eq.' + avaliacao.campanha_id + '&limit=1');
      if (!campanhas.length || campanhas[0].estado !== 'aberta') { mostrarErro('Esta campanha de avaliacao ja esta fechada.'); return; }

      var campanha = campanhas[0];
      var mesPartes = campanha.mes.split('-');
      var nomeMes = MESES_NOME[parseInt(mesPartes[1], 10) - 1] + ' ' + mesPartes[0];

      /* Ja preenchida? */
      if (avaliacao.auto_avaliacao) {
        document.getElementById('card-loading').style.display = 'none';
        document.getElementById('card-ja-preenchido').style.display = 'block';
        document.getElementById('data-submissao').textContent = formataData(avaliacao.auto_avaliacao_submetida_em, true);
        return;
      }

      /* Mostrar formulario */
      document.getElementById('card-loading').style.display = 'none';
      document.getElementById('card-formulario').style.display = 'block';
      document.getElementById('colab-nome').textContent = avaliacao.colaborador_nome;
      document.getElementById('colab-periodo').textContent = 'Periodo: ' + nomeMes;

      document.getElementById('colab-info').innerHTML =
        '<div><strong>Cargo</strong>' + escaparHTML(avaliacao.colaborador_cargo || '—') + '</div>' +
        '<div><strong>Departamento</strong>' + escaparHTML(avaliacao.colaborador_departamento || '—') + '</div>' +
        '<div><strong>Supervisor</strong>' + escaparHTML(avaliacao.supervisor_nome || '—') + '</div>' +
        '<div><strong>Prazo</strong>' + formataData(campanha.data_inicio) + ' a ' + formataData(campanha.data_fim) + '</div>';

      renderCriterios();
    } catch(e) {
      console.error(e);
      mostrarErro('Erro ao carregar a avaliacao. Tente novamente ou contacte o administrador.');
    }
  })();

  function mostrarErro(msg) {
    document.getElementById('card-loading').style.display = 'none';
    document.getElementById('card-erro').style.display = 'block';
    document.getElementById('msg-erro').textContent = msg;
  }

  function escaparHTML(str) {
    if (!str) return '';
    var div = document.createElement('div'); div.appendChild(document.createTextNode(str)); return div.innerHTML;
  }

  function formataData(dataISO, comHora) {
    if (!dataISO) return '—';
    var d = new Date(dataISO); if (isNaN(d.getTime())) return dataISO;
    var dia = String(d.getDate()).padStart(2, '0');
    var mes = String(d.getMonth() + 1).padStart(2, '0');
    var ano = d.getFullYear();
    if (comHora) { var h = String(d.getHours()).padStart(2, '0'); var m = String(d.getMinutes()).padStart(2, '0'); return dia + '/' + mes + '/' + ano + ' ' + h + ':' + m; }
    return dia + '/' + mes + '/' + ano;
  }

  /* === RENDER CRITERIOS === */
  function renderCriterios() {
    var c = document.getElementById('criterios-container');
    var html = '';
    CRITERIOS.forEach(function(cr) {
      html += '<div class="criterio">';
      html += '<div class="criterio-header">';
      html += '<span class="criterio-nome">' + cr.nome + '</span>';
      html += '<button class="criterio-desc-toggle" onclick="toggleDesc(this)">? O que e isto</button>';
      html += '</div>';
      html += '<div class="criterio-desc" id="desc-' + cr.id + '">' + cr.descricao + '</div>';
      html += '<div class="notas-row">';
      [1,2,3,4,5].forEach(function(n) {
        html += '<button class="nota-btn" data-criterio="' + cr.id + '" data-nota="' + n + '" onclick="selecionarNota(this)">' + n + ' — ' + NOTAS_LABEL[n] + '</button>';
      });
      html += '</div></div>';
    });
    c.innerHTML = html;
  }

  function toggleDesc(btn) {
    var criterioDiv = btn.closest('.criterio');
    var desc = criterioDiv.querySelector('.criterio-desc');
    desc.classList.toggle('visivel');
    btn.textContent = desc.classList.contains('visivel') ? '? Esconder' : '? O que e isto';
  }

  function selecionarNota(btn) {
    var criterioId = btn.getAttribute('data-criterio');
    var nota = parseInt(btn.getAttribute('data-nota'), 10);
    respostas[criterioId] = nota;

    /* Visual */
    var row = btn.parentElement;
    row.querySelectorAll('.nota-btn').forEach(function(b) { b.classList.remove('selecionada'); });
    btn.classList.add('selecionada');

    atualizarResumo();
  }

  function atualizarResumo() {
    var total = 0, count = 0;
    CRITERIOS.forEach(function(cr) { if (respostas[cr.id]) { total += respostas[cr.id]; count++; } });
    var resumo = document.getElementById('resumo-final');
    if (count > 0) {
      var media = Math.round((total / count) * 100) / 100;
      document.getElementById('resumo-media').textContent = media.toFixed(2) + ' / 5.00';
      var classif = media >= 4.5 ? 'Excede Expectativas' : media >= 3.5 ? 'Acima do Esperado' : media >= 2.5 ? 'Satisfaz' : media >= 1.5 ? 'Necessita Melhorias' : 'Insatisfaz';
      document.getElementById('resumo-classificacao').textContent = classif;
      resumo.style.display = 'block';
    } else {
      resumo.style.display = 'none';
    }
  }

  /* === SUBMETER === */
  async function submeterAvaliacao() {
    /* Validar todos preenchidos */
 var todosPreenchidos = true;
    CRITERIOS.forEach(function(cr) { if (!respostas[cr.id]) todosPreenchidos = false; });
    if (!todosPreenchidos) { alert('Por favor, avalie todos os criterios antes de submeter.'); return; }

    var btn = document.getElementById('btn-submeter');
    btn.disabled = true;
    btn.textContent = 'A submeter...';

    /* Calcular pontos */
    var soma = 0;
    CRITERIOS.forEach(function(cr) { soma += respostas[cr.id]; });
    var pontos = Math.round((soma / CRITERIOS.length) * 100) / 100;

    try {
      await db.update('rh_avaliacoes', avaliacao.id, {
        auto_avaliacao: respostas,
        auto_avaliacao_submetida_em: new Date().toISOString(),
        auto_observacoes: document.getElementById('obs-text').value.trim() || null,
        auto_avaliacao_pontos: pontos,
        estado: 'auto_preenchida',
        updated_at: new Date().toISOString()
      });

      /* Sucesso */
      document.getElementById('card-formulario').innerHTML = '<div class="msg-sucesso"><h3>Auto-Avaliacao submetida com sucesso!</h3><p>Obrigado, ' + escaparHTML(avaliacao.colaborador_nome) + '. A sua avaliacao foi registada.</p><p style="margin-top:8px;font-size:0.82rem;color:#7F8C8D;">Pode fechar esta pagina.</p></div>';
    } catch(e) {
      console.error(e);
      btn.disabled = false;
      btn.textContent = 'Submeter Auto-Avaliacao';
      alert('Erro ao submeter: ' + (e.message || e) + '. Tente novamente.');
    }
  }
  </script>
</body>
</html>

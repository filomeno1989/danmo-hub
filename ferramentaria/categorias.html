<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Categorias — Ferramentaria — Danmo Hub</title>

  <!-- CSS Global do Danmo Hub -->
  <link rel="stylesheet" href="../shared/style.css" />

  <style>
    .link-action {
      color: var(--cor-info);
      cursor: pointer;
      font-weight: 600;
      margin-right: 12px;
      transition: color var(--transicao);
    }
    .link-action:hover { color: var(--cor-ambar); }

    .link-danger {
      color: var(--cor-vermelho-danmo);
      cursor: pointer;
      font-weight: 600;
      transition: opacity var(--transicao);
    }
    .link-danger:hover { opacity: .8; }
  </style>
</head>
<body>
  <!-- O nosso nav.js injeta a topbar e sidebar aqui automaticamente -->
  <div id="navbar"></div>

  <main class="main">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px;">
      <div>
        <h1 class="pagina-titulo">Categorias de Ferramentas</h1>
        <p class="pagina-subtitulo">Gerir as categorias disponíveis no Inventário (ex: Ferramentas Manuais, Elétricas...)</p>
      </div>
      <button class="btn btn-primario" id="btn-novo">Nova Categoria</button>
    </div>

    <!-- Tabela Principal -->
    <div class="card" style="margin-top:24px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px;">
        <div class="form-label" style="font-size: 1.1rem; margin: 0;">Categorias</div>
        <span class="badge badge-info" id="count-categorias" style="font-size: 1rem; padding: 4px 12px;">0</span>
      </div>
      <div class="tabela-container">
        <div id="cat-loading" class="spinner" style="padding:32px;text-align:center;">A carregar categorias...</div>
        <div id="cat-empty" class="tabela-vazia" style="display:none;">Nenhuma categoria registada.</div>
        <table class="tabela" id="tabela-cat" style="display:none;">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Ferramentas Nesta Categoria</th>
              <th>Estado</th>
              <th>Acções</th>
            </tr>
          </thead>
          <tbody id="cat-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal Nova/Editar Categoria -->
  <div id="modal-cat" class="modal-fundo">
    <div class="modal" style="max-width: 420px;">
      <div class="modal-cabecalho">
        <span class="modal-titulo" id="modal-cat-title">Nova Categoria</span>
        <button class="modal-fechar" id="btn-fechar-x" aria-label="Fechar">&times;</button>
      </div>
      <div class="modal-corpo">
        <div class="form-grupo">
          <label class="form-label" for="c-nome">Nome da Categoria *</label>
          <input class="form-input" type="text" id="c-nome" required placeholder="Ex: Ferramentas Manuais" />
        </div>
      </div>
      <div class="modal-rodape">
        <button class="btn btn-secundario" id="btn-cancelar">Cancelar</button>
        <button class="btn btn-verde" id="btn-guardar">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Scripts Unificados do Danmo Hub -->
  <script src="../shared/supabase.js"></script>
  <script src="../shared/auth.js"></script>
  <script src="../shared/utils.js"></script>
  <script src="../shared/tema.js"></script>
  <script src="../shared/nav.js"></script>

  <script>
    /* ── Globals ── */
    var allCategorias = [];
    var toolCounts = {};
    var editingId = null;

    /* ── Load & Render ── */
    async function loadCategorias() {
      var loadingEl = document.getElementById('cat-loading');
      var emptyEl = document.getElementById('cat-empty');
      var tableEl = document.getElementById('tabela-cat');
      var tbody = document.getElementById('cat-tbody');
      var countEl = document.getElementById('count-categorias');

      loadingEl.style.display = 'block';
      emptyEl.style.display = 'none';
      tableEl.style.display = 'none';
      tbody.innerHTML = '';

      try {
        var categorias = await db.query('tool_categories', 'select=*&order=nome.asc');
        allCategorias = categorias || [];
        countEl.textContent = allCategorias.length;

        if (allCategorias.length === 0) {
          loadingEl.style.display = 'none';
          emptyEl.style.display = 'block';
          return;
        }

        /* Contar quantas ferramentas usam cada categoria */
        toolCounts = {};
        var tools = await db.query('tools', 'select=category_id&active=eq.true');
        (tools || []).forEach(function (t) {
          if (t.category_id) toolCounts[t.category_id] = (toolCounts[t.category_id] || 0) + 1;
        });

        allCategorias.forEach(function (c) {
          var tr = document.createElement('tr');
          var count = toolCounts[c.id] || 0;
          var estadoBadge = c.active
            ? '<span class="badge badge-sucesso">Ativa</span>'
            : '<span class="badge badge-secundario">Inativa</span>';
          var acaoTexto = c.active ? 'Desactivar' : 'Reactivar';

          tr.innerHTML =
            '<td>' + (c.nome || '—') + '</td>' +
            '<td><span class="badge badge-info">' + count + ' ferramentas</span></td>' +
            '<td>' + estadoBadge + '</td>' +
            '<td>' +
              '<span class="link-action" data-action="editar" data-id="' + c.id + '">Editar</span>' +
              '<span class="link-danger" data-action="alternar" data-id="' + c.id + '">' + acaoTexto + '</span>' +
            '</td>';
          tbody.appendChild(tr);
        });

        loadingEl.style.display = 'none';
        tableEl.style.display = 'table';
      } catch (err) {
        console.error('Erro ao carregar categorias:', err);
        loadingEl.style.display = 'none';
        emptyEl.style.display = 'block';
        mostrarToast('Erro ao carregar categorias.', 'erro');
      }
    }

    /* ── Event Delegation ── */
    document.getElementById('cat-tbody').addEventListener('click', async function (e) {
      var link = e.target.closest('[data-action]');
      if (!link) return;

      var action = link.dataset.action;
      var id = link.dataset.id;
      var cat = allCategorias.find(function (c) { return c.id === id; });
      if (!cat) return;

      if (action === 'editar') {
        editingId = id;
        document.getElementById('modal-cat-title').textContent = 'Editar Categoria';
        document.getElementById('c-nome').value = cat.nome || '';
        abrirModal('modal-cat');
      } else if (action === 'alternar') {
        var novoEstado = !cat.active;
        var msg = novoEstado
          ? 'Reactivar esta categoria? Volta a aparecer no formulário de Nova Ferramenta.'
          : 'Desactivar esta categoria? Deixa de aparecer no formulário de Nova Ferramenta (as ferramentas já criadas com ela mantêm-se).';
        if (!confirm(msg)) return;
        try {
          await db.update('tool_categories', id, { active: novoEstado });
          mostrarToast('Categoria ' + (novoEstado ? 'reactivada' : 'desactivada') + ' com sucesso.', 'sucesso');
          await loadCategorias();
        } catch (err) {
          console.error('Erro ao alternar categoria:', err);
          mostrarToast('Erro ao actualizar categoria.', 'erro');
        }
      }
    });

    /* ── Modal ── */
    document.getElementById('btn-novo').addEventListener('click', function () {
      editingId = null;
      document.getElementById('modal-cat-title').textContent = 'Nova Categoria';
      document.getElementById('c-nome').value = '';
      abrirModal('modal-cat');
    });

    document.getElementById('btn-cancelar').addEventListener('click', function () {
      fecharModal('modal-cat');
      editingId = null;
    });

    document.getElementById('btn-fechar-x').addEventListener('click', function () {
      fecharModal('modal-cat');
      editingId = null;
    });

    /* ── Save ── */
    document.getElementById('btn-guardar').addEventListener('click', async function () {
      var nome = document.getElementById('c-nome').value.trim();

      if (!nome) {
        mostrarToast('Preencha o nome da categoria.', 'erro');
        return;
      }

      var duplicada = allCategorias.some(function (c) {
        return c.nome.toLowerCase() === nome.toLowerCase() && c.id !== editingId;
      });
      if (duplicada) {
        mostrarToast('Já existe uma categoria com este nome.', 'erro');
        return;
      }

      try {
        if (editingId) {
          await db.update('tool_categories', editingId, { nome: nome });
          mostrarToast('Categoria actualizada com sucesso.', 'sucesso');
        } else {
          await db.insert('tool_categories', { nome: nome, active: true });
          mostrarToast('Categoria criada com sucesso.', 'sucesso');
        }
        fecharModal('modal-cat');
        editingId = null;
        await loadCategorias();
      } catch (err) {
        console.error('Erro ao guardar categoria:', err);
        mostrarToast('Erro ao guardar categoria.', 'erro');
      }
    });

    /* ── Init ── */
    loadCategorias();
  </script>
</body>
</html>
